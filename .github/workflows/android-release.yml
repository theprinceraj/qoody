name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease
      - name: Prepare release asset
        shell: bash
        run: |
          apk="androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          test -f "$apk"
          cp "$apk" "androidApp/build/outputs/apk/release/qoody-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mobile/androidApp/build/outputs/apk/release/qoody-${{ github.ref_name }}.apk
